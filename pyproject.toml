[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transit-platform"
version = "0.1.0"
description = "Streaming data platform for live public transport positions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.13",
    "certifi>=2024.7",
    "confluent-kafka>=2.5",
    "duckdb>=1.1",
    "paho-mqtt>=2.1",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "SQLAlchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
analytics = [
    # dbt-core 1.12 downloads a parser binary while it is installed
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.9",
]
dev = [
    "transit-platform[analytics]",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["transit_platform*", "gtfs*", "producer*", "processor*", "archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: needs a running PostgreSQL server",
    "stream: needs a running Kafka-compatible broker",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

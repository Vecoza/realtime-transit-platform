version: 2

models:
  - name: stg_stop_events
    description: Arrivals and departures; PostgreSQL rows for recent UTC days, Parquet for archived days.
    columns:
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ["arr", "dep"]
      - name: direction_id
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: match_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["matched", "missing_journey", "no_feed", "route_not_in_feed", "no_trip", "missing_stop", "stop_not_on_trip"]
  - name: stg_gtfs_trips
    tests:
      - unique_combination:
          arguments:
            columns: [feed_id, trip_id]
  - name: stg_gtfs_stop_times
    tests:
      - unique_combination:
          arguments:
            columns: [feed_id, trip_id, stop_sequence]
  - name: stg_gtfs_service_dates
  - name: stg_gtfs_routes
    tests:
      - unique_combination:
          arguments:
            columns: [feed_id, route_id]
  - name: stg_gtfs_stops
    tests:
      - unique_combination:
          arguments:
            columns: [feed_id, stop_id]

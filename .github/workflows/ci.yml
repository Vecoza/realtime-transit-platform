name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transit
          POSTGRES_PASSWORD: rtp_local_pw_2026
          POSTGRES_DB: transit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transit -d transit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_USER: transit
      POSTGRES_PASSWORD: rtp_local_pw_2026
      POSTGRES_DB: transit
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      PGPASSWORD: rtp_local_pw_2026
      KAFKA_BOOTSTRAP_SERVERS: localhost:19092

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: |
          pip install -c constraints.txt -e ".[dev]"
          pip check

      - name: Lint
        run: ruff check .

      - name: Start Redpanda
        run: docker compose up --detach --wait redpanda

      - name: Create schemas
        run: >-
          psql -h "$POSTGRES_HOST" -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          -v ON_ERROR_STOP=1 -f docker/init/01_create_schemas.sql

      - name: Apply migrations
        run: make migrate

      - name: Test
        run: pytest
